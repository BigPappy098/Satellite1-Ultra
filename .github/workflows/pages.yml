name: Publish calibration wizard

# Serves wizard/ as a GitHub Pages site so builders can use the calibration
# wizard without cloning the repository or installing anything.
on:
  push:
    branches: [main]
    paths:
      - "wizard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wizard
      - id: deployment
        uses: actions/deploy-pages@v4
