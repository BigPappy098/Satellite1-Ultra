name: Tagged release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: make release PYTHON=python PIP=pip
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: "release/Satellite1-Ultra-RC1.zip"
