name: Full geometry validation
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gmsh runtime library
        run: sudo apt-get update && sudo apt-get install --yes libglu1-mesa
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: make release PYTHON=python PIP=pip
      - uses: actions/upload-artifact@v4
        with:
          name: satellite1-ultra-validation
          path: |
            release/Satellite1-Ultra-RC1.zip
            reports/validation/
            reports/FINAL_RELEASE_STATUS.md
