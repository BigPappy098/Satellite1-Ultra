# Satellite1 Ultra physical calibration input
#
# Edit only this file after printing the calibration parts. All dimensions are
# millimetres; scale corrections are fractions (0.001 = +0.1%). Safe nominal
# defaults leave the CAD unchanged. `make calibrated-release` validates these
# values before it regenerates any full-size part.

xy_scale_correction_fraction: 0.0
z_scale_correction_fraction: 0.0
fastener_clearance_diameter_offset_mm: 0.0
insert_bore_diameter_offset_mm: 0.0
driver_cutout_diameter_offset_mm: 0.0
passive_radiator_cutout_diameter_offset_mm: 0.0
cable_passage_diameter_offset_mm: 0.0
gasket_sheet_thickness_mm: 2.0
gasket_compressed_thickness_offset_mm: 0.0
active_driver_flange_thickness_mm: 1.0
passive_radiator_flange_thickness_mm: 3.75
