project:
  name: Satellite1 Ultra
  units: mm
  evidence_default: ENGINEERING_ESTIMATE

hardware:
  board_revision: public_batch_1
  official_interface: squircle_midplate_threaded

enclosure:
  outer_width: 160.0
  outer_depth: 180.0
  corner_radius: 20.0
  cable_passage_x: 34.0
  cable_passage_y: 64.0
  grille_width_margin: 32.0
  grille_depth_margin: 32.0
  acoustic_top_z: -33.0
  acoustic_bottom_z: -194.0
  base_bottom_z: -216.0
  wall_thickness: 4.0
  divider_thickness: 4.0
  acoustic_floor_thickness: 8.0
  bottom_plate_thickness: 4.0
  print_clearance: 0.30
  component_bore_clearance: 0.20
  brace_rib_width: 5.0
  brace_rib_depth: 8.0
  driver_axis_z: -96.0
  passive_radiator_axis_z: -116.0

component_mounts:
  # Clamp-ring acoustic component mounts. Fasteners are deliberately outboard
  # of the component bolt circle so that no fastener feature can break into the
  # component through-bore; see reports/CLAUDE_TAKEOVER_AUDIT.md finding F-002.
  clamp_ring_thickness: 5.0
  clamp_lip: 1.0
  pad_backing: 3.0
  driver_clamp_ring_diameter: 118.0
  driver_clamp_bolt_circle: 112.0
  driver_pad_diameter: 126.0
  pr_clamp_ring_diameter: 140.0
  pr_clamp_bolt_circle: 130.0
  pr_pad_diameter: 144.0
  pr_ledge_depth: 5.0

sealing:
  gasket_thickness: 2.0
  target_compression_fraction: 0.25
  gasket_land_width: 4.0

fasteners:
  primary_size: M3
  primary_pitch: 0.5
  insert_outer_diameter: 4.6
  insert_bore_diameter: 4.2
  insert_length: 5.7
  insert_bore_extra: 1.5
  minimum_boss_wall: 2.4
  clearance_diameter: 3.4
  head_clearance_diameter: 6.5

acoustics:
  active_driver: dayton_nd91_4
  fallback_driver: tectonic_tebm65c20f_4
  passive_radiator: sb_acoustics_sb12pacr_00
  fallback_passive_radiator: dayton_dma105_pr
  passive_radiator_count: 2
  target_tuning_hz: 60.0
  leakage_q: 7.0
  # RC1 has no internal damping material. Add damping only after a measured
  # acoustic test establishes a safe location and a revised displacement value.
  damping_volume_fraction: 0.0
  amplifier_voltage_rms: 10.0
  amplifier_peak_current_a: 6.0

ballast:
  target_mass_g: 879
  maximum_mass_g: 1250
  cartridge_material: steel_plate_stack

printing:
  primary_material: ASA
  alternative_material: PETG
  maximum_build_dimension: 256.0
